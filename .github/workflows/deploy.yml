name: CI/CD Pipeline

on:
  push:
    branches:
      - main       # Production
      - develop    # Staging

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ./public
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p public
          echo "<h1>Hello World</h1>" > public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./public

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          sudo apt-get update
          sudo apt-get install tidy -y
          tidy -errors public/index.html || true

      - name: Check links
        run: |
          sudo apt-get install linkchecker -y
          linkchecker public/index.html || true

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed URL
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "Staging site is live at: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "Production site is live at: ${{ steps.deployment.outputs.page_url }}"
          fi
