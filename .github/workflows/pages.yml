name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history

      # 2️⃣ Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      # 3️⃣ Upload the site artifact
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public   # change if your site files are in another folder

      # 4️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 5️⃣ Output deployment URL in logs
      - name: Show deployment URL
        run: echo Site deployed at: ${{ steps.deployment.outputs.page_url }}

