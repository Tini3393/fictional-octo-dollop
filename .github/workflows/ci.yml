name: Deploy

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify public folder
        run: |
          if [ ! -d "./public" ]; then
            echo "Error: ./public folder does not exist. Deployment aborted."
            exit 1
          else
            echo "./public folder exists. Proceeding with deployment."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v4

      # Fixed version here ↓↓↓
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show GitHub Pages URL
        run: |
          echo "Your site is live at: ${{ steps.deployment.outputs.page_url }}"

