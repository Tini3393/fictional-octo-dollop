version: '3.9'

services:
  web:
    image: nginx:alpine
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    restart: unless-stopped

  app:
    image: node:18-alpine
    container_name: app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    restart: unless-stopped
